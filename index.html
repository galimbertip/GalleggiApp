const eur = n => (n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",useGrouping:"always"});
const eur0 = n => (n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0,useGrouping:"always"});
const fmtDate = d => new Date(d).toLocaleDateString("it-IT",{day:"numeric",month:"short"});
const fmtLong = d => new Date(d).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
const toInputDate = d => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const parseAmount = s => { const n=parseFloat(String(s).replace(/\s/g,"").replace(",",".")); return isNaN(n)?null:Math.round(n*100)/100; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random());

// Giorno di paga in un certo mese (se il mese è più corto, l'ultimo giorno del mese)
function paydayOf(year, month, payday){
  const dim = new Date(year, month+1, 0).getDate();
  return new Date(year, month, Math.min(payday, dim));
}
// Il "mese" di bilancio va da un giorno di paga (incluso) al successivo (escluso)
function cycleOf(date, payday){
  const d = new Date(date); d.setHours(12);
  const y=d.getFullYear(), m=d.getMonth();
  const p = paydayOf(y,m,payday);
  const start = d >= p ? p : paydayOf(y,m-1,payday);
  const end = paydayOf(start.getFullYear(), start.getMonth()+1, payday);
  return {start, end, key:`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,"0")}`};
}
function shiftCycle(cyc, n, payday){
  const s = paydayOf(cyc.start.getFullYear(), cyc.start.getMonth()+n, payday);
  return cycleOf(s, payday);
}
const cycleLabel = c => {
  const a=c.start.toLocaleDateString("it-IT",{day:"numeric",month:"short"});
  const e=new Date(c.end.getTime()-DAY).toLocaleDateString("it-IT",{day:"numeric",month:"short"});
  return `${a} – ${e}`;
};
// Data "contabile": lo stipendio arrivato qualche giorno prima del giorno di paga conta nel mese nuovo
function effectiveDate(t, payday){
  const d = new Date(t.date);
  if(t.type==="in" && t.category==="stipendio"){
    const next = shiftCycle(cycleOf(d,payday),1,payday).start;
    if(next - d <= SALARY_TOLERANCE_DAYS*DAY) return next;
  }
  return d;
}
const inCycle = (t,c,payday) => { const d=effectiveDate(t,payday); return d>=c.start && d<c.end; };

// ─── Firebase ──────────────────────────────────────────────────────────────
function useFb(){
  const [fb,setFb]=useState(window.__fb||null);
  useEffect(()=>{
    if(window.__fb){ setFb(window.__fb); return; }          // pronto nel frattempo: niente evento perso
    const on=()=>setFb(window.__fb);
    window.addEventListener("fb-ready",on,{once:true});
    const iv=setInterval(()=>{ if(window.__fb){ setFb(window.__fb); clearInterval(iv);} },300);
    return ()=>{window.removeEventListener("fb-ready",on);clearInterval(iv);};
  },[]);
  return fb;
}
function useAuth(fb){
  const [user,setUser]=useState(undefined);
  const [slow,setSlow]=useState(false);
  useEffect(()=>{
    if(!fb) return;
    // Completa un eventuale login via redirect (errori mostrati nella schermata di accesso)
    fb.getRedirectResult(fb.auth, fb.resolver).catch(e=>{ window.__authErr=e.code||e.message; });
    const t=setTimeout(()=>setSlow(true),8000);
    const un=fb.onAuthStateChanged(fb.auth,u=>{clearTimeout(t);setUser(u||null);},e=>{clearTimeout(t);window.__authErr=e.code||e.message;setUser(null);});
    return ()=>{clearTimeout(t);un();};
  },[fb]);
  return [user,slow];
}
function Diagnostic({stage}){
  const msg = stage==="fb"
    ? "Non riesco a caricare Firebase. Controlla la connessione o eventuali blocchi pubblicità/tracker sul dominio gstatic.com."
    : "Il servizio di accesso di Firebase non risponde. Verifica in Firebase → Authentication che il metodo Google sia attivo e che galimbertip.github.io sia tra i domini autorizzati.";
  return (
    <div style={{minHeight:"100vh",display:"grid",placeItems:"center",padding:24}}>
      <div style={{...card,maxWidth:400}}>
        <div style={{fontWeight:800,fontSize:18}}>⚠️ Sono ancora qui ad aspettare…</div>
        <div style={{fontSize:14,color:"var(--text-dim)",marginTop:8,lineHeight:1.45}}>{msg}</div>
        {window.__fbErr && <div style={{fontSize:12,color:"var(--red)",marginTop:8}}>Errore: {window.__fbErr}</div>}
        <button onClick={()=>location.reload()} style={{...btnP,width:"100%",marginTop:14}}>Riprova</button>
      </div>
    </div>
  );
}
function useCollection(fb, path, enabled=true){
  const [rows,setRows]=useState([]); const [err,setErr]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{
    if(!fb||!enabled||!path) return;
    const {db,collection,onSnapshot}=fb;
    return onSnapshot(collection(db,...path),
      s=>{setRows(s.docs.map(d=>({id:d.id,...d.data()})));setErr(null);setLoading(false);},
      e=>{setErr(e.message||String(e));setLoading(false);});
  },[fb,enabled,path&&path.join("/")]);
  return [rows,loading,err];
}
function useDocument(fb, path, enabled=true){
  const [data,setData]=useState(null); const [loaded,setLoaded]=useState(false);
  useEffect(()=>{
    if(!fb||!enabled||!path) return;
    const {db,doc,onSnapshot}=fb;
    return onSnapshot(doc(db,...path), s=>{setData(s.exists()?s.data():null);setLoaded(true);}, ()=>setLoaded(true));
  },[fb,enabled,path&&path.join("/")]);
  return [data,loaded];
}

// ─── Calcolo del bilancio ──────────────────────────────────────────────────
function computeCycle({cycle, now, txs, budget}){
  const payday = budget.payday;
  const list = txs.filter(t=>inCycle(t,cycle,payday));
  const ins  = list.filter(t=>t.type==="in");
  const outs = list.filter(t=>t.type==="out");
  const income = ins.reduce((a,t)=>a+t.amount,0);
  const spent  = outs.reduce((a,t)=>a+t.amount,0);
  const isCurrent = now>=cycle.start && now<cycle.end;

  // Stipendio previsto se nel mese corrente non è ancora stato registrato
  const salaryLogged = ins.some(t=>t.category==="stipendio");
  const pastSalaries = txs.filter(t=>t.type==="in"&&t.category==="stipendio").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);
  const avgSalary = pastSalaries.length ? pastSalaries.reduce((a,t)=>a+t.amount,0)/pastSalaries.length : 0;
  const expectedSalary = budget.expectedSalary || avgSalary;
  const salaryPending = isCurrent && !salaryLogged && expectedSalary>0 ? expectedSalary : 0;

  // Spese fisse non ancora pagate in questo mese
  const fixed = budget.fixed||[];
  const paidFixedIds = new Set(outs.filter(t=>t.fixedId).map(t=>t.fixedId));
  const pendingFixed = isCurrent ? fixed.filter(f=>!paidFixedIds.has(f.id)) : [];
  const pendingFixedTotal = pendingFixed.reduce((a,f)=>a+f.amount,0);

  // Spese "variabili" = tutto tranne le fisse: servono a stimare il ritmo di spesa
  const variableSpent = outs.filter(t=>!t.fixedId).reduce((a,t)=>a+t.amount,0);
  const totalDays  = Math.round((cycle.end-cycle.start)/DAY);
  const daysElapsed= isCurrent ? Math.max(1, Math.floor((now-cycle.start)/DAY)+1) : totalDays;
  const daysLeft   = isCurrent ? Math.max(1, totalDays-daysElapsed+1) : 0;
  // Se il bilancio è iniziato a metà di questo mese, il ritmo si calcola solo sui giorni tracciati
  const start      = budget.start || cycle.start;
  const effStart   = start>cycle.start ? start : cycle.start;
  const partial    = effStart>cycle.start;
  const trackedDays= isCurrent ? Math.max(1, Math.floor((now-effStart)/DAY)+1) : Math.max(1, Math.round((cycle.end-effStart)/DAY));
  const curRate    = variableSpent/trackedDays;
  // Ritmo "storico": media giornaliera delle spese variabili negli ultimi 3 mesi chiusi.
  // A inizio mese pochi giorni di dati sono rumorosi (basta un pieno): mescolo il ritmo attuale
  // con quello storico, che pesa come 10 giorni di dati e perde importanza man mano che il mese avanza.
  let histDays=0, histSpent=0;
  for(let i=1;i<=3;i++){
    const pc=shiftCycle(cycle,-i,payday);
    if(pc.end<=start) break;                                   // mese precedente all'inizio del bilancio
    const pStart = start>pc.start ? start : pc.start;
    const po=txs.filter(t=>t.type==="out"&&!t.fixedId&&inCycle(t,pc,payday));
    histSpent+=po.reduce((a,t)=>a+t.amount,0); histDays+=Math.round((pc.end-pStart)/DAY);
  }
  const histRate   = histDays>=7? histSpent/histDays : null;   // con meno di una settimana di storico non ha senso
  const PRIOR_DAYS = 10;
  const dailyRate  = (isCurrent && histRate!=null) ? (curRate*trackedDays + histRate*PRIOR_DAYS)/(trackedDays+PRIOR_DAYS) : curRate;

  const totalIncome = income + salaryPending;
  const available   = totalIncome - spent - pendingFixedTotal;      // cosa resta oggi, già tolte le fisse da pagare
  const projected   = isCurrent ? available - dailyRate*(daysLeft-1) : totalIncome - spent; // stima a fine mese
  const perDay      = isCurrent ? available/daysLeft : 0;

  let verdict;
  if(totalIncome<=0) verdict={level:"none"};
  else if(projected >= totalIncome*0.10) verdict={level:"ok"};
  else if(projected >= 0) verdict={level:"tight"};
  else verdict={level:"ko"};

  const byCat = {};
  outs.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount;});
  const cats = Object.entries(byCat).map(([id,v])=>({...catOf(id),value:v})).sort((a,b)=>b.value-a.value);

  return {list, income, spent, salaryPending, expectedSalary, pendingFixed, pendingFixedTotal, variableSpent,
          totalDays, daysElapsed, daysLeft, trackedDays, partial, effStart, dailyRate, curRate, histRate, totalIncome, available, projected, perDay, verdict, cats, isCurrent};
}

function Movements({txs,budget,cycle,setCycle,onDelete,onEdit,onAdd,onImport}){
  const [filter,setFilter]=useState("all");
  const list = txs.filter(t=>inCycle(t,cycle,budget.payday))
    .filter(t=>filter==="all"||t.type===filter)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  const groups=[]; list.forEach(t=>{const k=new Date(t.date).toDateString(); const g=groups.find(g=>g.k===k); g?g.items.push(t):groups.push({k,d:t.date,items:[t]});});
  return (
    <div className="fade" style={{display:"grid",gridTemplateColumns:"minmax(0,1fr)",gap:12}}>
      <QuickActions onAdd={onAdd} onImport={onImport}/>
      <CycleNav cycle={cycle} setCycle={setCycle} payday={budget.payday}/>

        ))}
      </div>
      <div style={card}>
        {groups.length===0 && <div style={{fontSize:13,color:"var(--text-dim)"}}>Nessun movimento in questo mese.</div>}
        {groups.map(g=>(
          <div key={g.k} style={{marginBottom:6}}>

  {id:"bevande",   label:"Bevande", icon:"🥤", re:/acqua|birr|vino|coca|aranciata|succo|bibit|spuma|gassos|energy|prosecco|spritz|chinott/i},
  {id:"dispensa",  label:"Dispensa", icon:"🍝", re:/pasta|spaghett|penne|fusill|riso|farin|zuccher|\bsale\b|olio|acet|passat|pelati|sugo|pesto|tonno|legum|ceci|fagiol|lenticch|pisell|mais|spezie|pepe|origano|dado|brodo|maionese|ketchup|senape|lievit|pangrattat|cioccolat|patatine|snack|noci|mandorl|crackers/i},
  {id:"casa",      label:"Casa e igiene", icon:"🧴", re:/detersiv|sapon|shampoo|bagnoschiuma|balsamo|dentifric|spazzolin|carta igien|scottex|carta (da )?cucina|tovagliol|sacch|spugn|ammorbid|candeggin|varechina|deodorant|rasoi|schiuma da barba|assorbent|fazzolett|alluminio|pellicol|lavastovigl|pastiglie|anticalcare|sgrassat|cotton|cerott/i},
];
const AISLE_OTHER = {id:"altro",label:"Altro",icon:"📦"};
const aisleOf = id => AISLES.find(a=>a.id===id) || AISLE_OTHER;
const guessAisle = name => (AISLES.find(a=>a.re.test(name))||AISLE_OTHER).id;
const normName = n => n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
function parseItem(raw){
  let s=raw.trim(), qty="";
  let m=s.match(/^(\d+(?:[.,]\d+)?\s*(?:kg|g|gr|l|lt|ml|pz|x|conf\.?|confezioni|bottiglie|pacchi|vasetti)?)\s+(.+)$/i);
  if(m){ qty=m[1].replace(/x$/i,"").trim(); s=m[2]; }
  else { m=s.match(/^(.+?)\s+(?:x\s*)?(\d+(?:[.,]\d+)?\s*(?:kg|g|gr|l|lt|ml|pz|conf\.?)?)$/i); if(m && /\d/.test(m[2])){ s=m[1]; qty=m[2].trim(); } }
  s=s.charAt(0).toUpperCase()+s.slice(1);
  return {name:s, qty};
}

function ShoppingList({fb,user,perDay,onCheckout}){
  const [items]=useCollection(fb,["users",user.uid,"shopping"],true);
  const [hist]=useDocument(fb,["users",user.uid,"meta","shoppingHistory"],true);
  const H=(hist&&hist.items)||{};
  const [text,setText]=useState("");
  const [editing,setEditing]=useState(null);
  const [closing,setClosing]=useState(false);
  const [copied,setCopied]=useState(false);
  const col=(...p)=>fb.doc(fb.db,"users",user.uid,...p);

  const sorted=[...items].sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  const todo=sorted.filter(i=>!i.done), done=sorted.filter(i=>i.done);
  const groups=[...AISLES,AISLE_OTHER].map(a=>({a,list:todo.filter(i=>(i.aisle||"altro")===a.id)})).filter(g=>g.list.length);
  const inList=new Set(items.map(i=>normName(i.name)));
  const suggestions=Object.entries(H).filter(([k])=>!inList.has(k)).sort((a,b)=>(b[1].count||0)-(a[1].count||0)||(b[1].last||"").localeCompare(a[1].last||"")).slice(0,14);
  const priceOf=i=> i.price!=null ? i.price : (H[normName(i.name)]&&H[normName(i.name)].price);
  const est=items.reduce((a,i)=>a+(priceOf(i)||0),0);
  const estCount=items.filter(i=>priceOf(i)).length;

  const addItem=async(raw, fromHist)=>{
    const lines=raw.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
    for(const line of lines){
      const p=fromHist?{name:fromHist.name,qty:""}:parseItem(line);
      const k=normName(p.name); if(!k) continue;
      const ex=items.find(i=>normName(i.name)===k&&!i.done);
      if(ex){ continue; }
      const h=H[k];
      const id=uid();
      await fb.setDoc(col("shopping",id),{id,name:p.name,qty:p.qty,aisle:(h&&h.aisle)||guessAisle(p.name),done:false,createdAt:new Date().toISOString()});
    }
    setText("");
  };
  const toggle=i=>fb.setDoc(col("shopping",i.id),{...i,done:!i.done,doneAt:!i.done?new Date().toISOString():null});
  const remove=i=>fb.deleteDoc(col("shopping",i.id));
  const saveEdit=async e=>{
    const p={...e, price:e.priceText?parseAmount(e.priceText):null}; delete p.priceText;
    await fb.setDoc(col("shopping",e.id),p);
    // ricorda il reparto scelto per la prossima volta
    const k=normName(e.name); await fb.setDoc(col("meta","shoppingHistory"),{items:{...H,[k]:{...(H[k]||{name:e.name,count:0}),aisle:e.aisle,...(p.price?{price:p.price}:{})}}});
    setEditing(null);
  };
  const clearDone=async()=>{ for(const i of done) await remove(i); };
  const share=async()=>{
    const t="🛒 Lista della spesa\n"+groups.map(g=>`\n${g.a.icon} ${g.a.label}\n`+g.list.map(i=>`• ${i.name}${i.qty?` (${i.qty})`:""}`).join("\n")).join("\n");
    try{ if(navigator.share){ await navigator.share({text:t}); return; } }catch(e){ return; }
    try{ await navigator.clipboard.writeText(t); setCopied(true); setTimeout(()=>setCopied(false),1600);}catch(e){}
  };
  const checkout=async({amount,store,date})=>{
    const bought=done.length?done:[];
    // aggiorna lo storico: quante volte compri ogni prodotto
    const nh={...H}; const now=new Date().toISOString();
    bought.forEach(i=>{ const k=normName(i.name); nh[k]={...(nh[k]||{}),name:i.name,aisle:i.aisle||guessAisle(i.name),count:((nh[k]&&nh[k].count)||0)+1,last:now,...(i.price?{price:i.price}:{})}; });
    await fb.setDoc(col("meta","shoppingHistory"),{items:nh});
    await onCheckout({id:uid(),type:"out",amount,category:"spesa",date:new Date(date+"T12:00:00").toISOString(),note:store||"Spesa",source:"lista",items:bought.map(i=>i.name),createdAt:now});
    for(const i of bought) await remove(i);
    setClosing(false);
  };

  return (
    <div className="fade" style={{display:"grid",gridTemplateColumns:"minmax(0,1fr)",gap:12}}>
      <div style={card}>
        <div style={{display:"flex",gap:8}}>

// ─── Schermata: Statistiche ────────────────────────────────────────────────
function Stats({txs,budget,now}){
  const cur=cycleOf(now,budget.payday);
  const cycles=[]; for(let i=5;i>=0;i--) cycles.push(shiftCycle(cur,-i,budget.payday));
  const rows=cycles.filter(c=>c.end>budget.start).map(c=>{
    const s=computeCycle({cycle:c,now,txs,budget});
    return {c, inc:s.income, out:s.spent, bal:s.income-s.spent, cats:s.cats, cur:s.isCurrent, partial:s.partial, effStart:s.effStart};
  }).filter(r=>r.inc>0||r.out>0||r.cur);
  const max=Math.max(1,...rows.map(r=>Math.max(r.inc,r.out)));
  const past=rows.filter(r=>!r.cur&&!r.partial);   // medie solo su mesi chiusi e tracciati per intero
  const avgOut = past.length? past.reduce((a,r)=>a+r.out,0)/past.length : 0;

  // media per categoria nei mesi chiusi vs mese in corso
  const catAvg={}; past.forEach(r=>r.cats.forEach(c=>{catAvg[c.id]=(catAvg[c.id]||0)+c.value/past.length;}));
  const curRow=rows.find(r=>r.cur);
  return (
    <div className="fade" style={{display:"grid",gridTemplateColumns:"minmax(0,1fr)",gap:12}}>
      <div style={card}>
        <div style={{fontWeight:700}}>Entrate e uscite, mese per mese</div>
        <div style={{fontSize:11,color:"var(--text-faint)",marginBottom:10}}>Ogni "mese" va da uno stipendio al successivo</div>
        {rows.map(r=>(
          <div key={r.c.key} style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
              <span style={{fontWeight:600}}>{cycleLabel(r.c)}{r.cur?" (in corso)":""}{r.partial&&!r.cur?` (dal ${fmtDate(r.effStart)})`:""}</span>
              <span className="num" style={{fontWeight:700,color:r.bal>=0?"var(--green)":"var(--red)"}}>{r.bal>=0?"+":""}{eur0(r.bal)}{r.cur?" finora":""}</span>
            </div>
            <div style={{height:7,background:"var(--surface-2)",borderRadius:4,marginTop:4}}><div style={{height:"100%",width:`${r.inc/max*100}%`,background:"var(--green)",borderRadius:4}}/></div>
            <div style={{height:7,background:"var(--surface-2)",borderRadius:4,marginTop:3}}><div style={{height:"100%",width:`${r.out/max*100}%`,background:"var(--red)",borderRadius:4}}/></div>
          </div>
        ))}
        <div style={{fontSize:11,color:"var(--text-faint)"}}>🟩 entrate · 🟥 uscite · numero a destra: risparmio del mese</div>
        <div style={{fontSize:11,color:"var(--text-faint)",marginTop:4}}>Bilancio tracciato dal {fmtLong(budget.start)}: i mesi prima non sono contati (si cambia in Opzioni).</div>
      </div>
      {past.length===0 && (
        <div style={{...card,fontSize:13,color:"var(--text-dim)",lineHeight:1.45}}>📊 Il confronto con la tua media comparirà quando avrai almeno un mese completo tracciato, da stipendio a stipendio.</div>
      )}
      {past.length>0 && (
        <div style={card}>
          <div style={{fontWeight:700,marginBottom:4}}>Questo mese (finora) vs la tua media</div>
          <div style={{fontSize:12,color:"var(--text-dim)",marginBottom:10}}>Media uscite dei mesi chiusi: <b className="num">{eur0(avgOut)}</b></div>
          {Object.keys({...catAvg,...Object.fromEntries((curRow?curRow.cats:[]).map(c=>[c.id,1]))}).map(id=>{
            const c=catOf(id); const a=catAvg[id]||0; const n=(curRow?.cats.find(x=>x.id===id)?.value)||0;
            const delta=a>0?(n-a)/a*100:null;
            return (
              <div key={id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid var(--border)",fontSize:13}}>
                <span>{c.icon} {c.label}</span>
                <span className="num"><b>{eur0(n)}</b> <span style={{color:"var(--text-faint)"}}>/ media {eur0(a)}</span></span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── Import PDF ────────────────────────────────────────────────────────────
// Legge il testo del PDF nel browser (il file non viene caricato da nessuna parte),
// ricostruisce le righe e riconosce: busta paga, documenti Telepass, documento generico.
const MONTHS_FULL = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const AMOUNT_RE = /(?:€\s*)?(-?\d{1,3}(?:[.\s]\d{3})*,\d{2}|-?\d+,\d{2}|-?\d{1,3}(?:,\d{3})*\.\d{2})(?:\s*€)?(?![\d%])/g;
const DATE_RE = /\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})\b/;
const SKIP_RE = /\b(totale|subtotale|imponibile|iva\b|saldo|riepilogo|progressiv|aliquota|di cui|importo complessivo|ritenut)/i;

function parseItAmount(s){
  s=s.replace(/[€\s]/g,"");
  if(/,\d{2}$/.test(s)) s=s.replace(/\./g,"").replace(",",".");
  else s=s.replace(/,/g,"");
  const n=parseFloat(s); return isNaN(n)?null:Math.round(n*100)/100;
}
function amountsIn(line){ const out=[]; let m; AMOUNT_RE.lastIndex=0; while((m=AMOUNT_RE.exec(line))){ const v=parseItAmount(m[1]); if(v!=null) out.push(v);} return out; }
function dateIn(line){
  const m=line.match(DATE_RE); if(!m) return null;
  let [_,d,mo,y]=m; d=+d; mo=+mo; y=+y; if(y<100) y+=2000;
  if(mo<1||mo>12||d<1||d>31||y<2000||y>2100) return null;
  return new Date(y,mo-1,d,12);
}

let _pdfjs=null;
function loadPdfJs(){
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    if(window.pdfjsLib) return res(window.pdfjsLib);
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); };
    s.onerror=()=>{_pdfjs=null;rej(new Error("Non riesco a caricare il lettore PDF"));};
    document.head.appendChild(s);
  });
  return _pdfjs;
}
async function pdfToLines(file, password){
  const lib=await loadPdfJs();
  const data=new Uint8Array(await file.arrayBuffer());
  const pdf=await lib.getDocument({data, password}).promise;
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const rows=[];
    tc.items.forEach(it=>{
      if(!it.str||!it.str.trim()) return;
      const y=it.transform[5], x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<3); if(!r){r={y,items:[]};rows.push(r);}
      r.items.push({x,s:it.str});
    });
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{
      r.items.sort((a,b)=>a.x-b.x);
      lines.push({text:r.items.map(i=>i.s).join(" ").replace(/\s+/g," ").trim(), page:p, items:r.items});
    });
  }
  return lines;
}

function detectKind(text){
  if(/netto\s*(a\s*pagare|del\s*mese|in\s*busta|busta|mese)|cedolino|busta\s*paga|libro\s*unico|competenze|trattenute/i.test(text)) return "busta";
  if(/telepass|unipolmove|autostrad|casello|pedagg/i.test(text)) return "pedaggi";
  return "generico";
}

function findPayPeriod(text){
  const re=new RegExp("("+MONTHS_FULL.join("|")+")\\s*[\\/\\-]?\\s*(20\\d{2})","i");
  const m=text.match(re); if(!m) return null;
  return {month:MONTHS_FULL.indexOf(m[1].toLowerCase()), year:+m[2]};
}
function parsePayslip(lines, payday){
  const text=lines.map(l=>l.text).join("\n");
  let net=null, candidates=[];
  for(let i=0;i<lines.length;i++){
    const L=lines[i];
    if(!/netto/i.test(L.text) || /progressiv|anno|annuo|cumulat/i.test(L.text)) continue;
    const strong=/netto\s*(a\s*pagare|del\s*mese|in\s*busta|busta|mese|pagato|da\s*pagare)/i.test(L.text);
    // importo sulla stessa riga, a destra di "netto"
    const idx=L.text.toLowerCase().indexOf("netto");
    let a=amountsIn(L.text.slice(idx)).filter(v=>v>0);
    // altrimenti cerca nelle 3 righe sotto, vicino alla colonna della parola "netto"
    if(!a.length){
      const lab=L.items.find(it=>/netto/i.test(it.s)); const x0=lab?lab.x:0;
      for(let j=i+1;j<=Math.min(i+3,lines.length-1)&&!a.length;j++){
        const near=lines[j].items.filter(it=>Math.abs(it.x-x0)<120).map(it=>it.s).join(" ");
        a=amountsIn(near).filter(v=>v>0);
        if(!a.length) a=amountsIn(lines[j].text).filter(v=>v>0);
      }
    }
    if(a.length) candidates.push({v:a[a.length-1],strong,line:L.text});
  }
  const best=candidates.find(c=>c.strong)||candidates[candidates.length-1];
  if(best) net=best.v;
  const per=findPayPeriod(text);
  let date=new Date();
  if(per){ date=paydayOf(per.year,per.month,payday); date.setHours(12); if(date>new Date()) date=new Date(); }
  const isThirteenth=/tredicesima|13\s*a\s*mensilit/i.test(text), isFourteenth=/quattordicesima|14\s*a\s*mensilit/i.test(text);
  const label=(isThirteenth?"Tredicesima":isFourteenth?"Quattordicesima":"Stipendio")+(per?` ${MONTHS_FULL[per.month]} ${per.year}`:"");
  const alts=[...new Set(candidates.map(c=>c.v))];
  return net? [{type:"in",category:isThirteenth||isFourteenth?"extra":"stipendio",amount:net,date,note:label,alts}] : [];
}
function parseRows(lines, kind){
  const rows=[];
  lines.forEach(L=>{
    const d=dateIn(L.text); if(!d) return;
    if(SKIP_RE.test(L.text)) return;
    const a=amountsIn(L.text.replace(DATE_RE,"")).filter(v=>v!==0);
    if(!a.length) return;
    let amount=a[a.length-1];
    let type=amount<0?"in":"out"; amount=Math.abs(amount);
    if(amount>5000) return;
    let note=L.text.replace(/\b\d{1,2}[\/.\-]\d{1,2}[\/.\-](\d{4}|\d{2})\b/g,"").replace(AMOUNT_RE,"").replace(/\b\d{1,2}:\d{2}(:\d{2})?\b/g,"").replace(/\s+/g," ").trim().slice(0,60);
    let category="altro";
    if(kind==="pedaggi"){
      category = /parchegg|sosta|park/i.test(L.text)?"trasporti": /canone|abbonament|quota/i.test(L.text)?"abbonamenti": /carburant|rifornim/i.test(L.text)?"trasporti":"pedaggi";
      if(/rimbors|accredit/i.test(L.text)) type="in", category="altro_in";
    }
    rows.push({type,category,amount,date:d,note:note||(kind==="pedaggi"?"Pedaggio":"Da PDF")});
  });
  return rows;
}
const importKey = r => `${toInputDate(r.date)}|${r.type}|${r.amount.toFixed(2)}|${(r.note||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,24)}`;

// Qui si estrae importo, esercente e tipo, e si apre il modulo già compilato.
const MERCHANT_CATS = [
  [/conad|coop|esselunga|lidl|eurospin|carrefour|pam\b|despar|famila|aldi|md\s|penny|iper|tigros|bennet|naturasi|crai|sigma|supermerc|alimentari|macelleria|panificio|forno/i,"spesa"],
  [/bar\b|caff|cafe|pasticc|ristor|pizz|trattoria|osteria|sushi|burger|mcdonald|kebab|piadin|gelat|pub\b|deliveroo|glovo|just\s*eat/i,"bar"],
  [/autostrad|telepass|pedagg|casello|unipolmove/i,"pedaggi"],
  [/trenitalia|italo|atm\b|tper|taxi|uber|parchegg|easypark|mycicero|sosta|car\s*sharing|enjoy|share\s*now|freenow/i,"trasporti"],
  [/farmac|parafarm|ospedal|medic|dentist|ottic/i,"salute"],
  [/tim\b|vodafone|windtre|wind\s*tre|iliad|fastweb|ho\.?\s*mobile|kena|very\s*mobile/i,"telefono"],
  [/netflix|spotify|disney|prime\s*video|dazn|now\s*tv|apple\.com|google\s*play|youtube/i,"abbonamenti"],
  [/enel|hera|iren|a2a|eni\s*plenitude|edison|sorgenia|acea|bollett/i,"bollette"],
  [/zara|h&m|decathlon|ovs|primark|uniqlo|calzedonia|intimissimi|scarpe|foot\s*locker/i,"vestiti"],
  [/cinema|teatro|museo|steam|playstation|xbox|ticketone|concert/i,"svago"],
];
const FUEL_RE=/\b(eni|q8|ip\b|tamoil|esso|shell|api\b|totalerg|erg\b|agip|repsol|kerotris|beyfin|carburant|benzin|distribut)/i;
function parseNotification(raw){
  const text=raw.replace(/\s+/g," ").trim();
  const m=text.match(/(?:€|eur)\s*(\d{1,3}(?:\.\d{3})*,\d{1,2}|\d+(?:[.,]\d{1,2})?)|(\d{1,3}(?:\.\d{3})*,\d{1,2}|\d+[.,]\d{2})\s*(?:€|eur)/i);
  let amount=null;
  if(m){ let v=(m[1]||m[2]); v=/,\d{1,2}$/.test(v)?v.replace(/\./g,"").replace(",","."):v.replace(",","."); amount=Math.round(parseFloat(v)*100)/100; }
  const income=/accredit|ricevut[oi]|bonifico in entrata|hai ricevuto|rimbors|stipend/i.test(text);
  let merchant="";
  const mm=text.match(/(?:\bpresso|\bda|\ba|\bat|\bto|\bsu)\s+([A-Z0-9][^€\d,.;:!]{1,40}?)(?=\s*(?:€|eur\b|con\b|il\b|alle\b|in data|del\b|tramite|\bper\b|[,.;:!]|$))/);
  if(mm) merchant=mm[1].trim();
  if(!merchant && m){   // es. "EUR 58,00 ENI STATION BOLOGNA il 02/11": esercente subito dopo l'importo
    const after=text.slice(m.index+m[0].length).match(/^\s*(?:€|eur)?\s*([A-Za-z][^€\d,.;:!]{1,40}?)(?=\s*(?:\bil\b|\bdel\b|\bcon\b|\balle\b|\bin data\b|[,.;:!]|\d|$))/i);
    if(after) merchant=after[1].trim();
  }
  merchant=merchant.replace(/\b(google\s*pay|google\s*wallet|carta|card)\b/ig,"").trim();
  let category=income?"altro_in":"altro";
  if(!income) for(const [re,c] of MERCHANT_CATS) if(re.test(merchant||text)){ category=c; break; }
  if(income && /stipend/i.test(text)) category="stipendio";
  const fuel=!income && FUEL_RE.test(merchant||text);
  return {type:income?"in":"out", amount, note:merchant, category, fuel, raw:text};
}
function readIncoming(){
  try{
    const h=location.hash||""; let raw=null;
    if(h.startsWith("#n=")){ const r=h.slice(3).replace(/\+/g," "); try{ raw=decodeURIComponent(r); }catch(e){ raw=r.replace(/%20/g," "); } }
    const q=new URLSearchParams(location.search);
    if(!raw && q.get("n")) raw=q.get("n");
    if(!raw) return null;
    history.replaceState(null,"",location.pathname);   // evita di riaprirlo ricaricando la pagina
    return parseNotification(raw);
  }catch(e){ return null; }
}

function explainAuth(code){
  const m={
    "auth/unauthorized-domain":"Dominio non autorizzato: in Firebase → Authentication → Settings → Authorized domains aggiungi galimbertip.github.io.",
    "auth/operation-not-allowed":"L'accesso con Google non è attivo: in Firebase → Authentication → Sign-in method abilita Google.",

  };
  return m[code] || ("Errore di accesso: "+code);
}

// ─── App ───────────────────────────────────────────────────────────────────
function App(){
  const fb=useFb();
  const [user,authSlow]=useAuth(fb);
  const [fbSlow,setFbSlow]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setFbSlow(true),10000);return()=>clearTimeout(t);},[]);
  const signedIn=!!user;
  const [tab,setTab]=useState("home");
  const [adding,setAdding]=useState(null); // {type} o {edit}
  const [importing,setImporting]=useState(false);
  const [toast,setToast]=useState(null);
  const [incoming,setIncoming]=useState(INCOMING);
  // nuova notifica mentre l'app è già aperta (l'automazione cambia solo l'hash)
  useEffect(()=>{ const on=()=>{ const n=readIncoming(); if(n) setIncoming(n); }; window.addEventListener("hashchange",on); return ()=>window.removeEventListener("hashchange",on); },[]);
  const now=useMemo(()=>new Date(),[tab]);

  const [txRows,txLoading,txErr]=useCollection(fb, signedIn?["users",user.uid,"transactions"]:null, signedIn);
  const [refuels]=useCollection(fb, ["refuels"], signedIn);
  const [budgetDoc,budgetLoaded]=useDocument(fb, signedIn?["users",user.uid,"meta","budget"]:null, signedIn);
  const budget = {payday:27, expectedSalary:0, fixed:[], ...(budgetDoc||{})};
  const [cycle,setCycle]=useState(null);
  useEffect(()=>{ if(budgetLoaded) setCycle(cycleOf(new Date(),budget.payday)); },[budgetLoaded,budget.payday]);

  // Rifornimenti di BenzinApp trasformati in uscite (sola lettura)
  const fuelTxs = useMemo(()=>refuels.filter(r=>r.amount>0&&r.datetime).map(r=>({
    id:"fuel-"+r.id, type:"out", amount:Number(r.amount), category:"carburante", date:r.datetime,
    note:`⛽ ${r.vehicle||"Rifornimento"}${r.pricePerLiter?` · ${Number(r.pricePerLiter).toFixed(3).replace(".",",")} €/L`:""}`, source:"benzinapp"
  })),[refuels]);
  const allTxs = useMemo(()=>[...txRows,...fuelTxs],[txRows,fuelTxs]);
  // Inizio del bilancio: scelto in Opzioni, altrimenti il primo movimento inserito/importato (non la benzina)
  const autoStart = useMemo(()=>{
    const ds=txRows.map(t=>effectiveDate(t,budget.payday)).filter(d=>!isNaN(d));
    const d = ds.length ? new Date(Math.min(...ds)) : cycleOf(new Date(),budget.payday).start;
    d.setHours(0,0,0,0); return d;
  },[txRows,budget.payday]);
  const start = budget.startDate ? new Date(budget.startDate+"T00:00:00") : autoStart;
  budget.start = start;
  const txs = useMemo(()=>allTxs.filter(t=>effectiveDate(t,budget.payday)>=start),[allTxs,start.getTime(),budget.payday]);

  const flash=m=>{setToast(m);setTimeout(()=>setToast(null),1800);};
  const saveTx=async t=>{ const {db,doc,setDoc}=fb; await setDoc(doc(db,"users",user.uid,"transactions",t.id),t); flash(t.updatedAt?"Modifica salvata":t.type==="in"?"Entrata salvata":"Spesa salvata"); };
  const saveMany=async list=>{ const {db,doc,writeBatch}=fb; for(let i=0;i<list.length;i+=400){ const b=writeBatch(db); list.slice(i,i+400).forEach(t=>b.set(doc(db,"users",user.uid,"transactions",t.id),t)); await b.commit(); } flash(`${list.length} movimenti importati`); };
  const openAdd=type=>setAdding({type});
  const openEdit=t=>setAdding({edit:t});
  const delTx=async t=>{ if(!confirm(`Eliminare ${t.note||catOf(t.category).label} (${eur(t.amount)})?`)) return; const {db,doc,deleteDoc}=fb; await deleteDoc(doc(db,"users",user.uid,"transactions",t.id)); };
  const saveBudget=async b=>{ const {db,doc,setDoc}=fb; await setDoc(doc(db,"users",user.uid,"meta","budget"),b); };
  const payFixed=async f=>{ await saveTx({id:uid(),type:"out",amount:f.amount,category:f.category,date:new Date().toISOString(),note:f.name,fixedId:f.id,source:"fissa",createdAt:new Date().toISOString()}); };

  if(!fb) return fbSlow ? <Diagnostic stage="fb"/> : <div style={{minHeight:"100vh",display:"grid",placeItems:"center",color:"var(--text-dim)"}}>Caricamento…</div>;
  if(user===undefined) return authSlow ? <Diagnostic stage="auth"/> : <div style={{minHeight:"100vh",display:"grid",placeItems:"center",color:"var(--text-dim)"}}>Controllo l'accesso…</div>;
  if(!user) return <Login fb={fb}/>;
  if(!cycle) return <div style={{minHeight:"100vh",display:"grid",placeItems:"center",color:"var(--text-dim)"}}>Carico i tuoi dati…</div>;

  const curCycle=cycleOf(now,budget.payday);
  const stats=computeCycle({cycle:curCycle,now,txs,budget});
  const recent=txs.filter(t=>inCycle(t,curCycle,budget.payday)).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  const TABS=[["home","Bilancio"],["mov","Movimenti"],["lista","🛒 Lista"],["stats","Grafici"],["set","⚙️"]];

  return (

          <button key={k} onClick={()=>setTab(k)} style={{...btnG,padding:"8px 2px",fontSize:12.5,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",borderRadius:999,background:tab===k?"var(--grad)":"var(--surface-2)",borderColor:tab===k?"transparent":"var(--border)"}}>{l}</button>
        ))}
      </nav>
      {txErr && <div style={{...card,borderColor:"var(--red)",marginBottom:12,fontSize:13}}>⚠️ Non riesco a leggere i dati: {txErr}. Controlla le regole di sicurezza di Firestore.</div>}

      {tab==="home"  && <Home stats={stats} cycle={curCycle} onPayFixed={payFixed} recent={recent} onAdd={openAdd} onImport={()=>setImporting(true)} onEdit={openEdit} onOpenSettings={()=>setTab("set")} hasBudget={!!budgetDoc}/>}
      {tab==="mov"   && <Movements txs={allTxs} budget={budget} cycle={cycle} setCycle={setCycle} onDelete={delTx} onEdit={openEdit} onAdd={openAdd} onImport={()=>setImporting(true)}/>}
      {tab==="lista" && <ShoppingList fb={fb} user={user} perDay={stats.perDay} onCheckout={saveTx}/>}
      {tab==="stats" && <Stats txs={txs} budget={budget} now={now}/>}
      {tab==="set"   && <Settings budget={budget} saveBudget={saveBudget} txs={allTxs} autoStart={autoStart} user={user} onLogout={()=>fb.signOut(fb.auth)}/>}
      {tab!=="set" && <GPverseFooter/>}

      {tab!=="set" && tab!=="lista" && (
        <button aria-label="Aggiungi movimento" onClick={()=>openAdd("out")} style={{position:"fixed",right:20,bottom:"calc(22px + env(safe-area-inset-bottom))",width:62,height:62,borderRadius:20,border:"none",background:"var(--grad)",color:"#fff",fontSize:32,fontWeight:300,boxShadow:"0 12px 28px -8px rgba(139,62,240,.7)"}}>+</button>
      )}
      {adding && <AddModal key={adding.edit?adding.edit.id:adding.type} initialType={adding.type} edit={adding.edit} onClose={()=>setAdding(null)} onSave={saveTx}/>}
      {!adding && incoming && <AddModal key="notif" prefill={incoming} onClose={()=>setIncoming(null)} onSave={async t=>{await saveTx({...t,source:"notifica"});}}/>}
      {importing && <ImportModal onClose={()=>setImporting(false)} onSaveMany={saveMany} txs={allTxs} payday={budget.payday}/>}

</script>

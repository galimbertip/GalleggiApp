  <script>
    // Errori interni della cache di Firestore: segno il problema e ricarico UNA volta con la memoria normale
    (function(){
      var RE=/INTERNAL ASSERTION FAILED|IndexedDB|persistence layer|failed-precondition|Failed to obtain (primary|exclusive)/i;
      function heal(msg){ try{
        if(!RE.test(String(msg||""))) return;
        localStorage.setItem("galleggiapp_memcache",String(Date.now()));
        if(!sessionStorage.getItem("galleggiapp_healed")){ sessionStorage.setItem("galleggiapp_healed","1"); location.reload(); }
      }catch(e){} }
      window.__fbHeal=heal;
      window.addEventListener("error",function(e){ heal(e.message||(e.error&&e.error.message)); });
      window.addEventListener("unhandledrejection",function(e){ var r=e.reason; heal(r&&(r.message||r.code)||r); });
    })();
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    // Stesso progetto Firebase di BenzinApp: così i rifornimenti si leggono direttamente.
    const cfg = {
      apiKey: "AIzaSyD9oVZP13hKQzCrp7rb0LOSU2VFLPR-igU",
      authDomain: "benzinapp-f4763.firebaseapp.com",
      projectId: "benzinapp-f4763",
      storageBucket: "benzinapp-f4763.firebasestorage.app",
      messagingSenderId: "186081684364",
      appId: "1:186081684364:web:ae67bd1b73540a275744a9"
    };
    const app  = initializeApp(cfg);
    // Cache locale persistente: se manca la rete o ricarichi la pagina, i dati non si perdono
    // e vengono sincronizzati con Firebase appena torna la connessione (stessi dati su PC e telefono).
    // Se la memoria locale ha dato problemi di recente (bug noto di Firestore), uso per 3 giorni
    // la memoria normale: i dati restano su Firebase, cambia solo la copia offline.
    let memOnly=false; try{ const t=+localStorage.getItem("galleggiapp_memcache")||0; memOnly = Date.now()-t < 3*86400000; }catch(e){}
    let db;
    try { db = memOnly ? getFirestore(app) : initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
    catch(e) { db = getFirestore(app); }
    window.__fbMemOnly = memOnly;
    // Niente popupRedirectResolver all'avvio: su mobile Firebase aprirebbe subito un iframe verso
    // authDomain e, se non risponde, l'app resterebbe ferma su "Caricamento". Lo passiamo solo al login.
    const auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence] });
    window.__fb = { db, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy, writeBatch, getDocs,
                    auth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, resolver: browserPopupRedirectResolver };
    window.dispatchEvent(new Event("fb-ready"));
  </script>
